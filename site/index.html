  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>医美博主定位评估<\u002Ftitle>\n<link rel=\"icon\" type=\"image/png\" sizes=\"32x32\" href=\"/favicon-32x32.png\">\n<link rel=\"icon\" type=\"image/png\" sizes=\"16x16\" href=\"/favicon-16x16.png\">\n<link rel=\"apple-touch-icon\" sizes=\"180x180\" href=\"/apple-touch-icon.png\">\n<script src=\"f7f848fa-5202-4569-a701-4c8843627d0b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link href=\"/fonts/fonts.css\" rel=\"stylesheet\">\n<style>\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;padding:0;background:#EFE6D8}\nbody{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}\nbutton{font:inherit;color:inherit;background:none;border:none;cursor:pointer}\ninput{font:inherit}\na{color:#8F2338;text-decoration:none}\na:hover{color:#6E1A2D}\n::selection{background:#F6E1DE;color:#1C1821}\nsvg{display:block}\nsummary{list-style:none}\nsummary::-webkit-details-marker{display:none}\n@keyframes veil{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\nbutton:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid rgba(143,35,56,.5);outline-offset:3px;border-radius:8px}\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"max-width:480px;margin:0 auto;min-height:100dvh;background:#FBF7F0;border-left:1px solid rgba(28,24,33,.08);border-right:1px solid rgba(28,24,33,.08);color:#1C1821;box-shadow:0 0 60px rgba(74,18,32,.06)\">\n\n  <sc-if value=\"{{ atCover }}\" hint-placeholder-val=\"{{ true }}\">\n    <div data-screen-label=\"封面\" style=\"min-height:100dvh;background:radial-gradient(rgba(251,247,240,.055) .5px,rgba(23,19,31,0) .6px) 0 0/3px 3px,radial-gradient(120% 50% at 50% 7%,rgba(185,148,63,.2),rgba(23,19,31,0) 62%),#17131F;box-shadow:inset 0 0 90px rgba(14,11,20,.55);padding:58px 26px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;animation:veil .56s cubic-bezier(.16,1,.3,1)\">\n      <div style=\"font-family:'Noto Sans SC',sans-serif;font-size:11px;font-weight:500;letter-spacing:.34em;color:#C75A6B\">美丽派 · 美学实验室<\u002Fdiv>\n\n      <svg width=\"136\" height=\"88\" sc-camel-view-box=\"0 0 132 88\" fill=\"none\" stroke=\"#D9B866\" stroke-width=\"1\" stroke-linecap=\"round\" style=\"margin:32px auto 28px;filter:drop-shadow(0 0 14px rgba(185,148,63,.28))\" aria-hidden=\"true\">\n        <circle cx=\"18\" cy=\"18\" r=\"8\"><\u002Fcircle><circle cx=\"42\" cy=\"18\" r=\"8\"><\u002Fcircle><circle cx=\"66\" cy=\"18\" r=\"8\"><\u002Fcircle>\n        <circle cx=\"90\" cy=\"18\" r=\"8\"><\u002Fcircle><circle cx=\"114\" cy=\"18\" r=\"8\"><\u002Fcircle>\n        <g fill=\"#D9B866\" stroke=\"none\">\n          <path d=\"M42 10 A8 8 0 0 1 42 26 A14 14 0 0 0 42 10\"><\u002Fpath>\n          <path d=\"M66 10 A8 8 0 0 1 66 26 Z\"><\u002Fpath>\n          <circle cx=\"90\" cy=\"18\" r=\"8\"><\u002Fcircle>\n          <circle cx=\"114\" cy=\"18\" r=\"8\"><\u002Fcircle>\n        <\u002Fg>\n        <path d=\"M114 10 A8 8 0 0 0 114 26 A14 14 0 0 1 114 10\" fill=\"#17131F\" stroke=\"none\"><\u002Fpath>\n        <g opacity=\".34\" stroke-width=\".75\" stroke-dasharray=\"2 4\"><path d=\"M18 28v12M42 28v12M66 28v12M90 28v12M114 28v12\"><\u002Fpath><\u002Fg>\n        <g opacity=\".65\" stroke-width=\".75\"><path d=\"M6 43h50M76 43h50M66 43v10\"><\u002Fpath><\u002Fg>\n        <path d=\"M62 40l4 6 4-6\" opacity=\".8\" stroke-width=\".75\"><\u002Fpath>\n        <rect x=\"48\" y=\"54\" width=\"36\" height=\"26\" rx=\"2\" stroke=\"#F2E4BE\"><\u002Frect>\n        <g opacity=\".4\" stroke-width=\".75\" stroke=\"#F2E4BE\"><path d=\"M55 62h22M55 68h22M55 74h13\"><\u002Fpath><\u002Fg>\n      <\u002Fsvg>\n\n      <h1 style=\"margin:0;font-family:'Noto Serif SC',serif;font-weight:400;font-size:44px;line-height:1.46;letter-spacing:.14em;color:#FBF7F0;text-shadow:0 1px 24px rgba(14,11,20,.5)\">医美博主<br>定位评估<\u002Fh1>\n\n      <div style=\"display:flex;align-items:center;gap:14px;margin:24px 0 22px\">\n        <span style=\"width:56px;height:1px;background:linear-gradient(90deg,rgba(217,184,102,0),#B9943F)\"><\u002Fspan>\n        <span style=\"font-size:13px;color:#D9B866;line-height:1\">☾<\u002Fspan>\n        <span style=\"width:56px;height:1px;background:linear-gradient(90deg,#B9943F,rgba(217,184,102,0))\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <p style=\"margin:0;max-width:19em;font-family:'Noto Serif SC',serif;font-size:15.5px;line-height:2.05;letter-spacing:.03em;color:#E8DCC7;text-wrap:pretty\">医美博主自我定位评估。<br>不看粉丝量，只看两件事。<br>你的信任从哪里来，你的钱从谁那里来。<\u002Fp>\n\n      <div style=\"margin:34px 0 0;width:100%;max-width:20em;display:flex;flex-direction:column;text-align:left\">\n        <div style=\"display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(244,236,223,.1)\">\n          <span style=\"flex:none;width:20px;font-family:'Cormorant Garamond',serif;font-size:16px;color:#B9943F;padding-top:2px\">01<\u002Fspan>\n          <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;letter-spacing:.02em;color:#D5C3A4\">把你放进二十五格矩阵里的某一格，并告诉你这一格稳不稳<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;padding:13px 0;border-bottom:1px solid rgba(244,236,223,.1)\">\n          <span style=\"flex:none;width:20px;font-family:'Cormorant Garamond',serif;font-size:16px;color:#B9943F;padding-top:2px\">02<\u002Fspan>\n          <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;letter-spacing:.02em;color:#D5C3A4\">算出你的信任贴现率，看你是在攒，还是在透支<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;padding:13px 0\">\n          <span style=\"flex:none;width:20px;font-family:'Cormorant Garamond',serif;font-size:16px;color:#B9943F;padding-top:2px\">03<\u002Fspan>\n          <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;letter-spacing:.02em;color:#D5C3A4\">给三条只对你这一格成立的下一步<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:28px 0 0;font-family:'Noto Sans SC',sans-serif;font-size:11.5px;line-height:2.1;letter-spacing:.1em;color:#7E758E\">极简版 · 12 道固定题 · 约 3 分钟<br>不联网、不上传、不记录，结果只在这台设备上<\u002Fp>\n\n      <button type=\"button\" sc-camel-on-click=\"{{ onStart }}\" style=\"margin:30px 0 0;width:100%;max-width:20em;min-height:54px;border-radius:8px;background:#F4ECDF;color:#17131F;font-family:'Noto Sans SC',sans-serif;font-size:14.5px;letter-spacing:.24em;box-shadow:0 8px 20px rgba(14,11,20,.35)\" style-hover=\"background:#FBF7F0\" style-active=\"transform:translateY(1px)\">开始评估 · 极简<\u002Fbutton>\n\n      <button type=\"button\" sc-camel-on-click=\"{{ onStartAdv }}\" style=\"margin:14px 0 0;width:100%;max-width:20em;min-height:48px;border-radius:8px;background:transparent;border:1px solid rgba(244,236,223,.32);color:#E8DCC7;font-family:'Noto Sans SC',sans-serif;font-size:12.5px;letter-spacing:.18em\" style-hover=\"border-color:rgba(244,236,223,.7);background:rgba(244,236,223,.06)\" style-active=\"transform:translateY(1px)\">进阶评估 · 从 132 题随机抽题<\u002Fbutton>\n\n      <button type=\"button\" sc-camel-on-click=\"{{ onShareSite }}\" style=\"margin:16px 0 0;background:none;border:none;color:rgba(232,220,199,.6);font-family:'Noto Sans SC',sans-serif;font-size:11.5px;letter-spacing:.24em;padding:8px 12px;min-height:36px\" style-hover=\"color:#E8DCC7\" style-active=\"transform:translateY(1px)\">分享本测评 ↗<\u002Fbutton>\n\n      <div style=\"margin-top:44px;padding-top:26px;border-top:1px solid rgba(244,236,223,.1);width:100%;max-width:20em\">\n        <div style=\"font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.3em;color:#E8DCC7\">{{ brandPub }}<\u002Fdiv>\n        <div style=\"margin-top:10px;font-family:'Noto Sans SC',sans-serif;font-size:11px;line-height:2.1;letter-spacing:.08em;color:#7E758E\">{{ brandAuthor }}<br>{{ brandContact }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ atQuiz }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"答题\">\n      <div style=\"position:sticky;top:0;z-index:20;background:#FBF7F0;border-bottom:1px solid rgba(28,24,33,.08)\">\n        <div style=\"display:flex;align-items:center;gap:14px;padding:13px 24px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onBack }}\" disabled=\"{{ backOff }}\" style=\"flex:none;font-family:'Noto Sans SC',sans-serif;font-size:12px;letter-spacing:.1em;color:#9B93A1;padding:4px 8px 4px 0\" style-hover=\"color:#8F2338\">← 上一题<\u002Fbutton>\n          <div style=\"flex:1;height:1px;background:rgba(28,24,33,.14);position:relative\">\n            <div style=\"{{ fillStyle }}\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"flex:none;font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.12em;color:#6B6470;font-variant-numeric:tabular-nums\">{{ idxLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:34px 26px 44px;background:radial-gradient(120% 30% at 50% 0%,rgba(185,148,63,.07),rgba(251,247,240,0) 70%);animation:veil .44s cubic-bezier(.16,1,.3,1)\">\n        <div style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.32em;color:#8F2338\">{{ qSect }}<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-family:'Noto Serif SC',serif;font-weight:400;font-size:21px;line-height:1.68;letter-spacing:.03em;color:#1C1821;text-wrap:balance\">{{ qTitle }}<\u002Fh2>\n        <sc-if value=\"{{ qNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:11px 0 0;font-family:'Noto Serif SC',serif;font-size:13px;line-height:1.9;letter-spacing:.02em;color:#6B6470\">{{ qNote }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <div style=\"margin-top:26px;display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ opts }}\" as=\"o\" hint-placeholder-count=\"5\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"{{ o.style }}\" style-hover=\"border-color:rgba(28,24,33,.3)\" style-active=\"transform:scale(.99)\">\n              <span style=\"{{ o.dot }}\"><\u002Fspan>\n              <span style=\"font-family:'Noto Serif SC',serif;font-size:15px;line-height:1.62;letter-spacing:.015em\">{{ o.label }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ manualNext }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onNext }}\" style=\"margin-top:22px;width:100%;min-height:50px;border-radius:8px;background:#8F2338;color:#FBF7F0;font-family:'Noto Sans SC',sans-serif;font-size:14px;letter-spacing:.22em\" style-hover=\"background:#6E1A2D\">{{ nextLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ autoHint }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:22px 0 0;text-align:center;font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.1em;color:#9B93A1\">选完自动进入下一题<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ atRes }}\" hint-placeholder-val=\"{{ false }}\">\n    <div data-screen-label=\"结果\" style=\"padding:22px 0 0;animation:veil .5s cubic-bezier(.16,1,.3,1)\">\n\n      <div style=\"margin:0 18px;border-radius:22px;padding:38px 24px 34px;text-align:center;background:radial-gradient(rgba(251,247,240,.055) .5px,rgba(23,19,31,0) .6px) 0 0/3px 3px,radial-gradient(110% 44% at 50% 0%,rgba(185,148,63,.2),rgba(23,19,31,0) 64%),#17131F;box-shadow:0 30px 80px -20px rgba(74,18,32,.3),0 8px 24px rgba(23,19,31,.1),inset 0 0 60px rgba(14,11,20,.5)\">\n        <div style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.36em;color:#C75A6B\">你的定位<\u002Fdiv>\n        <div style=\"margin:16px 0 8px;font-family:'Noto Serif SC',serif;font-weight:400;font-size:33px;line-height:1.4;letter-spacing:.1em;color:#FBF7F0\">{{ name }}<\u002Fdiv>\n        <div style=\"font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.1em;color:#D5C3A4\">{{ coord }}<\u002Fdiv>\n        <div style=\"margin-top:18px\"><span style=\"{{ stateStyle }}\">{{ stateLabel }}<\u002Fspan><\u002Fdiv>\n\n        <div style=\"margin:30px 0 0;display:flex;flex-direction:column;align-items:center\">\n          <svg width=\"196\" height=\"110\" sc-camel-view-box=\"0 0 200 112\" aria-hidden=\"true\">\n            <path d=\"M22 96 A78 78 0 0 1 178 96\" fill=\"none\" stroke=\"rgba(244,236,223,.16)\" stroke-width=\"1\"><\u002Fpath>\n            <path d=\"M22 96 A78 78 0 0 1 178 96\" fill=\"none\" stroke=\"#D9B866\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-dasharray=\"{{ gauge.len }}\" stroke-dashoffset=\"{{ gauge.off }}\"><\u002Fpath>\n            <line x1=\"100\" y1=\"96\" x2=\"{{ gauge.nx }}\" y2=\"{{ gauge.ny }}\" stroke=\"#C75A6B\" stroke-width=\"1\"><\u002Fline>\n            <circle cx=\"100\" cy=\"96\" r=\"2.5\" fill=\"#C75A6B\"><\u002Fcircle>\n            <text x=\"22\" y=\"110\" font-size=\"9\" font-family=\"Cormorant Garamond, serif\" fill=\"#7E758E\">0<\u002Ftext>\n            <text x=\"178\" y=\"110\" font-size=\"9\" font-family=\"Cormorant Garamond, serif\" fill=\"#7E758E\" text-anchor=\"end\">100<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"margin-top:6px;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:58px;line-height:1;letter-spacing:.02em;color:#FBF7F0;font-variant-numeric:tabular-nums;text-shadow:0 0 34px rgba(185,148,63,.42)\">{{ dr }}<\u002Fdiv>\n          <div style=\"margin-top:12px;font-family:'Noto Sans SC',sans-serif;font-size:10.5px;letter-spacing:.28em;color:#7E758E\">信任贴现率<\u002Fdiv>\n          <div style=\"margin-top:12px;font-family:'Noto Serif SC',serif;font-size:13.5px;letter-spacing:.08em;color:#D5C3A4\">{{ bandLine }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;margin:30px 0 20px\">\n          <span style=\"width:44px;height:1px;background:linear-gradient(90deg,rgba(185,148,63,0),#B9943F)\"><\u002Fspan>\n          <span style=\"font-size:11px;color:#B9943F;line-height:1\">❦<\u002Fspan>\n          <span style=\"width:44px;height:1px;background:linear-gradient(90deg,#B9943F,rgba(185,148,63,0))\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 auto;max-width:20em;font-family:'Noto Serif SC',serif;font-size:15.5px;line-height:2.05;letter-spacing:.02em;color:#F4ECDF;text-wrap:pretty\">{{ verdict }}<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"padding:0 26px 0\">\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin:40px 0 14px\">\n          <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338;white-space:nowrap\">定位清晰度<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n          <span style=\"font-family:'Noto Serif SC',serif;font-size:12px;letter-spacing:.08em;color:#6B6470\">{{ clarity }}<\u002Fspan>\n        <\u002Fdiv>\n        <div>\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:9px 0\">\n              <span style=\"{{ b.label }}\">{{ b.name }}<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:rgba(28,24,33,.14);position:relative\"><i style=\"{{ b.fill }}\"><\u002Fi><\u002Fspan>\n              <span style=\"flex:none;width:2.6em;text-align:right;font-family:'Cormorant Garamond',serif;font-size:14px;color:#6B6470;font-variant-numeric:tabular-nums\">{{ b.val }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:16px 0 0;padding-top:14px;border-top:1px solid rgba(28,24,33,.08);font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.95;letter-spacing:.02em;color:#3C3540;text-wrap:pretty\">{{ clarityNote }}<\u002Fp>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin:40px 0 14px\">\n          <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338;white-space:nowrap\">你在这一格<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ onModalOpen }}\" aria-label=\"矩阵怎么读\" title=\"矩阵怎么读\" style=\"flex:none;display:flex;align-items:center;gap:7px;min-height:32px;padding:0 12px 0 9px;border:1px solid rgba(28,24,33,.16);border-radius:999px;background:#FFFDF8;color:#6B6470;font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.08em;transition:border-color 200ms,color 200ms\" style-hover=\"border-color:#8F2338;color:#8F2338\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1\" stroke-linecap=\"round\"><circle cx=\"7\" cy=\"7\" r=\"6\"><\u002Fcircle><path d=\"M7 6.2v4\"><\u002Fpath><path d=\"M7 4.1v.1\"><\u002Fpath><\u002Fsvg>\n            怎么读\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"background:#FFFDF8;border:1px solid rgba(28,24,33,.12);border-radius:14px;padding:16px 12px 12px\">\n          <svg sc-camel-view-box=\"{{ mx.vb }}\" width=\"100%\" role=\"img\" aria-label=\"定位矩阵\">\n            <g stroke=\"rgba(28,24,33,.14)\" stroke-width=\".75\" fill=\"none\">\n              <sc-for list=\"{{ mx.grid }}\" as=\"g\" hint-placeholder-count=\"0\">\n                <line x1=\"{{ g.x1 }}\" y1=\"{{ g.y1 }}\" x2=\"{{ g.x2 }}\" y2=\"{{ g.y2 }}\"><\u002Fline>\n              <\u002Fsc-for>\n            <\u002Fg>\n            <g font-family=\"Noto Sans SC, sans-serif\" font-size=\"8.5\" fill=\"#6B6470\">\n              <sc-for list=\"{{ mx.labels }}\" as=\"l\" hint-placeholder-count=\"0\">\n                <text x=\"{{ l.x }}\" y=\"{{ l.y }}\" text-anchor=\"{{ l.anchor }}\">{{ l.t }}<\u002Ftext>\n              <\u002Fsc-for>\n            <\u002Fg>\n            <g fill=\"none\" stroke=\"#B9943F\" stroke-width=\".9\">\n              <sc-for list=\"{{ mx.stable }}\" as=\"s\" hint-placeholder-count=\"0\">\n                <rect x=\"{{ s.x }}\" y=\"{{ s.y }}\" width=\"{{ s.w }}\" height=\"{{ s.h }}\" rx=\"2\"><\u002Frect>\n              <\u002Fsc-for>\n            <\u002Fg>\n            <g stroke=\"#C75A6B\" stroke-width=\".8\" fill=\"none\">\n              <sc-for list=\"{{ mx.cross }}\" as=\"c\" hint-placeholder-count=\"0\">\n                <line x1=\"{{ c.x1 }}\" y1=\"{{ c.y1 }}\" x2=\"{{ c.x2 }}\" y2=\"{{ c.y2 }}\"><\u002Fline>\n              <\u002Fsc-for>\n            <\u002Fg>\n            <rect x=\"{{ mx.here.x }}\" y=\"{{ mx.here.y }}\" width=\"{{ mx.here.w }}\" height=\"{{ mx.here.h }}\" rx=\"3\" fill=\"rgba(143,35,56,.07)\" stroke=\"#8F2338\" stroke-width=\"1.6\"><\u002Frect>\n            <circle cx=\"{{ mx.here.cx }}\" cy=\"{{ mx.here.cy }}\" r=\"3\" fill=\"#8F2338\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px 20px;padding:12px 6px 4px;border-top:1px solid rgba(28,24,33,.08);margin-top:8px\">\n            <span style=\"display:flex;align-items:center;gap:7px;font-family:'Noto Sans SC',sans-serif;font-size:10.5px;letter-spacing:.06em;color:#6B6470\"><i style=\"width:14px;height:11px;border:1.6px solid #8F2338;border-radius:2px;display:block\"><\u002Fi>你在这里<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;font-family:'Noto Sans SC',sans-serif;font-size:10.5px;letter-spacing:.06em;color:#6B6470\"><i style=\"width:14px;height:11px;border:1px solid #B9943F;border-radius:2px;display:block\"><\u002Fi>稳定<\u002Fspan>\n            <span style=\"display:flex;align-items:center;gap:7px;font-family:'Noto Sans SC',sans-serif;font-size:10.5px;letter-spacing:.06em;color:#6B6470\"><svg width=\"14\" height=\"11\" sc-camel-view-box=\"0 0 14 11\" stroke=\"#C75A6B\" stroke-width=\"1\"><line x1=\"1\" y1=\"1\" x2=\"13\" y2=\"10\"><\u002Fline><line x1=\"1\" y1=\"10\" x2=\"13\" y2=\"1\"><\u002Fline><\u002Fsvg>高危<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;margin:14px 0 8px\">\n          <span style=\"width:26px;height:1px;background:linear-gradient(90deg,rgba(185,148,63,0),rgba(185,148,63,.7))\"><\u002Fspan>\n          <span style=\"font-family:'Cormorant Garamond',serif;font-size:11px;color:#B9943F;line-height:1\">❦<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:linear-gradient(90deg,rgba(185,148,63,.7),rgba(185,148,63,0))\"><\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-family:'Noto Serif SC',serif;font-size:12.5px;line-height:1.95;letter-spacing:.02em;color:#6B6470;text-wrap:pretty\">二十五个格子，立得住的只有几个。空白处不是没人走，是走了留不下。<\u002Fp>\n\n        <sc-if value=\"{{ hasWarn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"display:flex;align-items:center;gap:12px;margin:40px 0 14px\">\n              <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338;white-space:nowrap\">预警<\u002Fspan>\n              <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border:1px solid rgba(199,90,107,.45);background:rgba(199,90,107,.06);border-radius:14px;padding:4px 18px;display:flex;flex-direction:column\">\n              <sc-for list=\"{{ warns }}\" as=\"w\" hint-placeholder-count=\"0\">\n                <p style=\"{{ w.style }}\">{{ w.t }}<\u002Fp>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin:40px 0 8px\">\n          <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338;white-space:nowrap\">下一步<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ advs }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:14px;padding:16px 0;border-bottom:1px solid rgba(28,24,33,.08)\">\n            <span style=\"flex:none;width:20px;font-family:'Cormorant Garamond',serif;font-size:17px;color:#B9943F;padding-top:3px\">{{ a.n }}<\u002Fspan>\n            <span style=\"display:block\">\n              <span style=\"display:block;font-family:'Noto Serif SC',serif;font-size:15px;line-height:1.75;letter-spacing:.02em;color:#1C1821\">{{ a.t }}<\u002Fspan>\n              <span style=\"display:block;margin-top:7px;font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;letter-spacing:.015em;color:#6B6470;text-wrap:pretty\">{{ a.b }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin:40px 0 14px\">\n          <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338;white-space:nowrap\">和上次对比<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ cmpMsg }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0 0 12px;border:1px solid rgba(28,24,33,.12);border-radius:14px;padding:15px 17px;background:#FFFDF8;font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;color:#3C3540;text-wrap:pretty\">{{ cmpMsg }}<\u002Fp>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasCmp }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border:1px solid rgba(28,24,33,.12);border-radius:14px;padding:6px 17px 15px;background:#FFFDF8;margin-bottom:12px\">\n            <sc-for list=\"{{ cmpRows }}\" as=\"row\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(28,24,33,.08);font-family:'Noto Serif SC',serif;font-size:13.5px;letter-spacing:.02em\">\n                <span style=\"color:#6B6470\">{{ row.k }}<\u002Fspan>\n                <span style=\"color:#1C1821;text-align:right\">{{ row.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <p style=\"margin:13px 0 0;font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;color:#3C3540;text-wrap:pretty\">{{ cmpSay }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:9px;margin:4px 0 12px\">\n          <input type=\"text\" sc-camel-input-mode=\"text\" sc-camel-auto-complete=\"off\" aria-label=\"上次结果\" placeholder=\"粘贴上次的结果链接或 12 位码\" value=\"{{ cmpText }}\" sc-camel-on-change=\"{{ onCmpText }}\" sc-camel-on-key-down=\"{{ onCmpKey }}\" style=\"flex:1;min-width:0;border:1px solid rgba(28,24,33,.16);border-radius:8px;background:#FFFDF8;color:#1C1821;font-family:'Noto Sans SC',sans-serif;font-size:13px;padding:13px 14px;letter-spacing:.05em;outline:none\" style-focus=\"border-color:#8F2338;box-shadow:0 0 0 3px rgba(143,35,56,.12)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onCmpGo }}\" style=\"flex:none;border:1px solid #8F2338;border-radius:8px;color:#8F2338;padding:0 18px;font-family:'Noto Sans SC',sans-serif;font-size:13px;letter-spacing:.1em\" style-hover=\"background:#8F2338;color:#FBF7F0\">对比<\u002Fbutton>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-family:'Noto Serif SC',serif;font-size:12.5px;line-height:1.95;color:#6B6470\">本次的 12 位码是 <b style=\"font-family:'Cormorant Garamond',serif;font-weight:500;font-size:14px;letter-spacing:.14em;color:#8F2338\">{{ code }}<\u002Fb>，存下来，三个月后回来对比。<\u002Fp>\n\n        <div style=\"display:flex;align-items:center;gap:12px;margin:40px 0 4px\">\n          <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338;white-space:nowrap\">我的回答<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n        <\u002Fdiv>\n        <details style=\"border-bottom:1px solid rgba(28,24,33,.08)\">\n          <summary style=\"cursor:pointer;padding:16px 0;display:flex;justify-content:space-between;align-items:center;font-family:'Noto Serif SC',serif;font-size:13.5px;letter-spacing:.06em;color:#3C3540\">12 道题的原始选择<span style=\"font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.1em;color:#9B93A1\">展开 / 收起<\u002Fspan><\u002Fsummary>\n          <div style=\"padding-bottom:10px\">\n            <sc-for list=\"{{ review }}\" as=\"v\" hint-placeholder-count=\"0\">\n              <div style=\"padding:11px 0;border-top:1px solid rgba(28,24,33,.08)\">\n                <span style=\"display:block;font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.05em;color:#9B93A1;margin-bottom:3px\">{{ v.q }}<\u002Fspan>\n                <span style=\"display:block;font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.8;color:#3C3540\">{{ v.a }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdetails>\n\n        <div style=\"padding:32px 0 0;display:flex;flex-direction:column;gap:10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onShare }}\" style=\"width:100%;min-height:54px;border-radius:8px;background:#8F2338;color:#FBF7F0;font-family:'Noto Sans SC',sans-serif;font-size:14.5px;letter-spacing:.24em;box-shadow:0 2px 6px rgba(23,19,31,.06)\" style-hover=\"background:#6E1A2D\" style-active=\"transform:translateY(1px)\">{{ shareLabel }}<\u002Fbutton>\n          <sc-if value=\"{{ share }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"animation:veil .45s cubic-bezier(.16,1,.3,1)\">\n              <img src=\"{{ share }}\" alt=\"定位评估结果\" style=\"width:100%;display:block;border:1px solid rgba(28,24,33,.12);border-radius:14px\">\n              <p style=\"margin:12px 0 0;text-align:center;font-family:'Noto Sans SC',sans-serif;font-size:11.5px;letter-spacing:.1em;color:#9B93A1\">长按图片保存或转发<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCopy }}\" style=\"width:100%;min-height:48px;border:1px solid rgba(28,24,33,.16);border-radius:8px;color:#3C3540;font-family:'Noto Sans SC',sans-serif;font-size:13px;letter-spacing:.16em;background:#FFFDF8\" style-hover=\"border-color:rgba(28,24,33,.3)\">分享结果链接<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onAgain }}\" style=\"width:100%;min-height:48px;border:1px solid rgba(28,24,33,.16);border-radius:8px;color:#3C3540;font-family:'Noto Sans SC',sans-serif;font-size:13px;letter-spacing:.16em;background:#FFFDF8\" style-hover=\"border-color:rgba(28,24,33,.3)\">重新评估<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ onHome }}\" style=\"width:100%;min-height:48px;border:1px solid rgba(28,24,33,.16);border-radius:8px;color:#3C3540;font-family:'Noto Sans SC',sans-serif;font-size:13px;letter-spacing:.16em;background:#FFFDF8\" style-hover=\"border-color:rgba(28,24,33,.3)\">回到首页<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin:44px -26px 0;padding:36px 26px 40px;border-top:1px solid rgba(28,24,33,.12);background:#F4ECDF;text-align:center\">\n          <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px\">\n            <span style=\"width:40px;height:1px;background:linear-gradient(90deg,rgba(185,148,63,0),#B9943F)\"><\u002Fspan>\n            <span style=\"font-size:11px;color:#B9943F;line-height:1\">☾<\u002Fspan>\n            <span style=\"width:40px;height:1px;background:linear-gradient(90deg,#B9943F,rgba(185,148,63,0))\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'Noto Serif SC',serif;font-size:13px;letter-spacing:.3em;color:#1C1821\">{{ brandPub }}<\u002Fdiv>\n          <div style=\"margin-top:11px;font-family:'Noto Sans SC',sans-serif;font-size:11px;line-height:2.1;letter-spacing:.08em;color:#6B6470\">{{ brandAuthor }}<br>{{ brandContact }}<\u002Fdiv>\n          <div style=\"margin-top:16px;font-family:'Noto Sans SC',sans-serif;font-size:10.5px;line-height:1.95;letter-spacing:.04em;color:#9B93A1\">本工具用于自我校准，不构成对任何个人或机构的评价。<br>贴现率为经验刻度，非测量值。<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ modal }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onModalClose }}\" style=\"{{ mOverlay }}\">\n      <div role=\"dialog\" aria-modal=\"true\" aria-label=\"二十五格矩阵怎么读\" sc-camel-on-click=\"{{ stop }}\" style=\"{{ mSheet }}\">\n        <sc-if value=\"{{ mIsSheet }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;justify-content:center;padding:10px 0 2px\"><span style=\"width:38px;height:3px;border-radius:999px;background:rgba(28,24,33,.18)\"><\u002Fspan><\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"{{ mHead }}\">\n          <div>\n            <div style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.3em;color:#8F2338\">阅读说明<\u002Fdiv>\n            <div style=\"margin-top:9px;font-family:'Noto Serif SC',serif;font-size:19px;line-height:1.5;letter-spacing:.05em;color:#1C1821\">二十五格矩阵怎么读<\u002Fdiv>\n          <\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onModalClose }}\" aria-label=\"关闭\" style=\"flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(28,24,33,.14);border-radius:999px;color:#6B6470;background:#FFFDF8;transition:border-color 200ms,color 200ms\" style-hover=\"border-color:#8F2338;color:#8F2338\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 13 13\" stroke=\"currentColor\" stroke-width=\"1.1\" stroke-linecap=\"round\"><path d=\"M1.5 1.5l10 10M11.5 1.5l-10 10\"><\u002Fpath><\u002Fsvg>\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"{{ mBody }}\">\n          <p style=\"margin:0;font-family:'Noto Serif SC',serif;font-size:15px;line-height:2;letter-spacing:.02em;color:#3C3540;text-wrap:pretty\">横轴是钱从谁那里来，纵轴是信任从哪里来。两轴相交，得到二十五种可能的位置。你落在其中一格，这一格决定了你能做什么内容、能收谁的钱，以及什么时候会出问题。<\u002Fp>\n\n          <div style=\"display:flex;align-items:center;gap:10px;margin:26px 0 12px\">\n            <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.28em;color:#8F2338;white-space:nowrap\">纵轴 · 信任从哪来<\u002Fspan>\n            <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ mTrust }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:14px;padding:10px 0;border-bottom:1px solid rgba(28,24,33,.07)\">\n              <span style=\"flex:none;width:5em;font-family:'Noto Serif SC',serif;font-size:13.5px;letter-spacing:.04em;color:#1C1821\">{{ r.k }}<\u002Fspan>\n              <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;letter-spacing:.015em;color:#6B6470;text-wrap:pretty\">{{ r.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex;align-items:center;gap:10px;margin:26px 0 12px\">\n            <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.28em;color:#8F2338;white-space:nowrap\">横轴 · 钱从哪来<\u002Fspan>\n            <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ mMoney }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;gap:14px;padding:10px 0;border-bottom:1px solid rgba(28,24,33,.07)\">\n              <span style=\"flex:none;width:5em;font-family:'Noto Serif SC',serif;font-size:13.5px;letter-spacing:.04em;color:#1C1821\">{{ r.k }}<\u002Fspan>\n              <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;letter-spacing:.015em;color:#6B6470;text-wrap:pretty\">{{ r.v }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display:flex;align-items:center;gap:10px;margin:26px 0 12px\">\n            <span style=\"font-family:'Noto Sans SC',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.28em;color:#8F2338;white-space:nowrap\">三种标记<\u002Fspan>\n            <span style=\"flex:1;height:1px;background:rgba(28,24,33,.12)\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"display:flex;gap:13px;align-items:flex-start\">\n              <span style=\"flex:none;width:20px;height:15px;margin-top:4px;border:1.8px solid #8F2338;border-radius:2px\"><\u002Fspan>\n              <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;color:#3C3540;text-wrap:pretty\"><b style=\"font-weight:500;color:#1C1821\">你在这里。<\u002Fb>由你这次十二道题的选择推出，不是你希望在的那一格。<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:13px;align-items:flex-start\">\n              <span style=\"flex:none;width:20px;height:15px;margin-top:4px;border:1px solid #B9943F;border-radius:2px\"><\u002Fspan>\n              <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;color:#3C3540;text-wrap:pretty\"><b style=\"font-weight:500;color:#1C1821\">稳定。<\u002Fb>信任来源和收钱方式指向同一批人，利益方向一致，做久了会越做越轻。<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:13px;align-items:flex-start\">\n              <svg width=\"20\" height=\"15\" sc-camel-view-box=\"0 0 20 15\" stroke=\"#C75A6B\" stroke-width=\"1.2\" style=\"flex:none;margin-top:4px\"><path d=\"M1 1l18 13M1 14L19 1\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.9;color:#3C3540;text-wrap:pretty\"><b style=\"font-weight:500;color:#1C1821\">高危。<\u002Fb>整列渠道返佣都打叉。按到店或成交结算，你的收入就和读者的利益对立，无论信任从哪来都一样。<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;margin:28px 0 14px\">\n            <span style=\"width:34px;height:1px;background:linear-gradient(90deg,rgba(185,148,63,0),#B9943F)\"><\u002Fspan>\n            <span style=\"font-family:'Cormorant Garamond',serif;font-size:11px;color:#B9943F;line-height:1\">❦<\u002Fspan>\n            <span style=\"width:34px;height:1px;background:linear-gradient(90deg,#B9943F,rgba(185,148,63,0))\"><\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-family:'Noto Serif SC',serif;font-size:13.5px;line-height:1.95;letter-spacing:.02em;color:#6B6470;text-wrap:pretty\">既不是稳定也不是高危的格子，判定为过渡态。过渡态不是错，是还没走完。它的问题在于：内容按一种身份做，钱按另一种身份收，时间长了两头都薄。<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"{{ mFoot }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onModalClose }}\" style=\"{{ mBtn }}\" style-hover=\"background:#6E1A2D\">知道了<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toast }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:60;background:#17131F;color:#F4ECDF;font-family:'Noto Sans SC',sans-serif;font-size:12.5px;letter-spacing:.1em;padding:11px 22px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 20px rgba(23,19,31,.25)\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932},&quot;autoAdvance&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;答题行为&quot;},&quot;advanceDelay&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:260,&quot;min&quot;:0,&quot;max&quot;:900,&quot;step&quot;:20,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;答题行为&quot;},&quot;brandPub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;丽格晓冬&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;品牌&quot;},&quot;brandAuthor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;于意云&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;品牌&quot;},&quot;brandMail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sooogooo@139.com&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;品牌&quot;},&quot;brandWechat&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;@sooogooo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;品牌&quot;}}\">\nclass Component extends DCLogic {\n  TRUST = {QUAL:\"执业资质型\",EXP:\"亲身体验型\",INTEL:\"信息差型\",AES:\"审美判断型\",IND:\"产业视角型\"};\n  TSHORT = {QUAL:\"执业资质\",EXP:\"亲身体验\",INTEL:\"信息差\",AES:\"审美判断\",IND:\"产业视角\"};\n  TKEY = [\"QUAL\",\"EXP\",\"INTEL\",\"AES\",\"IND\"];\n  MONEY = {C2C:\"C端付费\",AD:\"B端广告\",REB:\"渠道返佣\",OWN:\"自营\",NONE:\"暂不变现\"};\n  MKEY = [\"C2C\",\"AD\",\"REB\",\"OWN\",\"NONE\"];\n  BASE = {REB:40,OWN:26,AD:22,C2C:8,NONE:6};\n  STABLE = [\"EXP|C2C\",\"INTEL|C2C\",\"AES|AD\",\"IND|OWN\",\"QUAL|NONE\",\"IND|C2C\",\"QUAL|C2C\",\"IND|AD\"];\n  QV = 1;  // 题库布局版本:题库增删时 +1,旧深链据此拒绝还原\n\n  QB = [\n    [\n     {s:\"信任从哪来\",t:\"读者在评论区最常问你什么?\",n:\"想第一反应，不想应该是什么。\",o:[[\"这个项目我能不能做，有什么风险\",{\"QUAL\":2}],[\"你做完多久恢复的，疼不疼\",{\"EXP\":2}],[\"哪家靠谱，多少钱，能不能便宜\",{\"INTEL\":2}],[\"我这张脸适合什么样子\",{\"AES\":2}],[\"这个行业接下来会怎么走\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"直播间里刷屏最多的问题是?\",n:\"刷屏的那类，就是冲着你来的人。\",o:[[\"这个术式安不安全，有什么禁忌\",{\"QUAL\":2}],[\"你做完多久自然，过程疼不疼\",{\"EXP\":2}],[\"同款哪里买，怎么辨别真假\",{\"INTEL\":2}],[\"我这个基础条件，做什么风格合适\",{\"AES\":2}],[\"这个行业现在入局还来得及吗\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"读者夸你“专业”，他们说的其实是?\",n:\"别人嘴里的专业，就是你的位置。\",o:[[\"讲得清原理和边界\",{\"QUAL\":2}],[\"亲自试过，敢说真话\",{\"EXP\":2}],[\"行情门儿清，不带我踩坑\",{\"INTEL\":2}],[\"审美在线，眼光毒\",{\"AES\":2}],[\"看得比普通人远一层\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"如果停更一周，回来第一条评论大概率在问?\",n:\"他们等的是你，还是你的某项功能。\",o:[[\"某项技术的最新说法\",{\"QUAL\":2}],[\"你的近况和恢复进度\",{\"EXP\":2}],[\"某家机构最近怎么样\",{\"INTEL\":2}],[\"让你看张照片给建议\",{\"AES\":2}],[\"某个行业事件的看法\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"你的评论区里，最常出现的句式是?\",n:\"\",o:[[\"“这个说法有依据吗”\",{\"QUAL\":2}],[\"“你后来恢复得怎样”\",{\"EXP\":2}],[\"“这价格贵不贵”\",{\"INTEL\":2}],[\"“这个风格适合我吗”\",{\"AES\":2}],[\"“这行现在还好做吗”\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"读者把你当什么用?\",n:\"工具属性，决定信任属性。\",o:[[\"半个咨询师，先问再做\",{\"QUAL\":2}],[\"一个先行者，替他们试过了\",{\"EXP\":2}],[\"一个情报站，跟着避坑\",{\"INTEL\":2}],[\"一双眼睛，替他们看\",{\"AES\":2}],[\"一个窗口，看这个行业\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"私信里被问得最深的一层是?\",n:\"\",o:[[\"适应症和禁忌症的细节\",{\"QUAL\":2}],[\"心态和恢复期怎么熬\",{\"EXP\":2}],[\"底价和渠道\",{\"INTEL\":2}],[\"整体协调和风格\",{\"AES\":2}],[\"产业链里的门道\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"你发什么内容，评论区最热闹?\",n:\"热闹的地方，就是人群所在。\",o:[[\"辟谣和纠错帖\",{\"QUAL\":2}],[\"翻车和恢复实录\",{\"EXP\":2}],[\"比价和扒皮帖\",{\"INTEL\":2}],[\"改造前后对比分析\",{\"AES\":2}],[\"行业事件点评\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"新粉丝关注你之后，第一条互动通常是?\",n:\"\",o:[[\"翻你旧文做功课\",{\"QUAL\":2}],[\"问你个人体验\",{\"EXP\":2}],[\"求一份清单\",{\"INTEL\":2}],[\"让你点评她的底子\",{\"AES\":2}],[\"潜水看你对行业的判断\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"如果读者只能记住你一句话，你希望是?\",n:\"这句就是你的定位。\",o:[[\"“她讲的东西都靠得住”\",{\"QUAL\":2}],[\"“她真的做过，说的是真的”\",{\"EXP\":2}],[\"“跟着她买不踩坑”\",{\"INTEL\":2}],[\"“她眼光很好”\",{\"AES\":2}],[\"“她懂这行的底层逻辑”\",{\"IND\":2}]]},\n     {s:\"信任从哪来\",t:\"你的高赞评论，大多出现在哪种内容下面?\",n:\"\",o:[[\"硬核科普破圈\",{\"QUAL\":2}],[\"真实记录引发共鸣\",{\"EXP\":2}],[\"避坑省钱实用帖\",{\"INTEL\":2}],[\"审美观点被热议\",{\"AES\":2}],[\"行业预言被验证\",{\"IND\":2}]]}\n    ],\n    [\n     {s:\"内容与定位\",t:\"你的内容里，出现频率最高的是?\",n:\"按最近三十条内容算。\",o:[[\"适应症、禁忌症、术后管理\",{\"QUAL\":2}],[\"我的过程、我的恢复、我踩过的坑\",{\"EXP\":2}],[\"价格、机构、真假货、避坑清单\",{\"INTEL\":2}],[\"比例、风格、什么叫做得好\",{\"AES\":2}],[\"政策、数据、谁在做什么\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"打开草稿箱，你写了一半没发的是?\",n:\"没发完的，往往是你在意又不敢发的。\",o:[[\"一篇想讲清楚原理的长文\",{\"QUAL\":2}],[\"一段想聊的心路\",{\"EXP\":2}],[\"一份想扒的价格内幕\",{\"INTEL\":2}],[\"一个想讲的美学观点\",{\"AES\":2}],[\"一篇想写的行业观察\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"你的爆款，大多属于哪一类?\",n:\"\",o:[[\"硬核科普破圈\",{\"QUAL\":2}],[\"真实记录引发共鸣\",{\"EXP\":2}],[\"避坑省钱实用帖\",{\"INTEL\":2}],[\"审美观点被热议\",{\"AES\":2}],[\"行业预言被验证\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"如果只能保留一个系列，你留下?\",n:\"删到只剩一个，才知道哪个是根。\",o:[[\"原理与风险系列\",{\"QUAL\":2}],[\"我的亲历系列\",{\"EXP\":2}],[\"市场行情系列\",{\"INTEL\":2}],[\"风格审美系列\",{\"AES\":2}],[\"行业格局系列\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"你写得最不费力的是?\",n:\"不费力的地方，就是积累所在。\",o:[[\"查文献、对指南\",{\"QUAL\":2}],[\"复盘自己的经历\",{\"EXP\":2}],[\"打听价格和渠道\",{\"INTEL\":2}],[\"描述什么是好\",{\"AES\":2}],[\"分析供需和格局\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"广告主投你，主要买你的什么?\",n:\"\",o:[[\"专业形象背书\",{\"QUAL\":2}],[\"真实体验的感染力\",{\"EXP\":2}],[\"对消费决策的影响力\",{\"INTEL\":2}],[\"审美调性的匹配\",{\"AES\":2}],[\"行业话语权\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"收藏多于点赞的内容，你的是?\",n:\"收藏是刚需，点赞是情绪。\",o:[[\"干货指南\",{\"QUAL\":2}],[\"恢复日记\",{\"EXP\":2}],[\"比价清单\",{\"INTEL\":2}],[\"风格图鉴\",{\"AES\":2}],[\"行业图谱\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"三年后你希望别人提起你时说?\",n:\"\",o:[[\"“她说的都能信”\",{\"QUAL\":2}],[\"“她是一路做过来的人”\",{\"EXP\":2}],[\"“她带的路没坑”\",{\"INTEL\":2}],[\"“她眼光是真好”\",{\"AES\":2}],[\"“她对这行看得很透”\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"别人模仿你，最先抄走的是?\",n:\"被抄走的，就是你最显眼的资产。\",o:[[\"你的科普框架\",{\"QUAL\":2}],[\"你的叙事方式\",{\"EXP\":2}],[\"你的情报渠道\",{\"INTEL\":2}],[\"你的审美表达\",{\"AES\":2}],[\"你的分析视角\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"你的内容删掉哪一块，老读者会最先发现?\",n:\"\",o:[[\"风险提示部分\",{\"QUAL\":2}],[\"个人经历部分\",{\"EXP\":2}],[\"价格信息部分\",{\"INTEL\":2}],[\"审美判断部分\",{\"AES\":2}],[\"行业分析部分\",{\"IND\":2}]]},\n     {s:\"内容与定位\",t:\"深夜你还在改的那类稿子是?\",n:\"\",o:[[\"怕讲错的科普\",{\"QUAL\":2}],[\"不敢发太真的经历\",{\"EXP\":2}],[\"得罪人的内幕\",{\"INTEL\":2}],[\"说不清的美学表达\",{\"AES\":2}],[\"没人爱看的行业判断\",{\"IND\":2}]]}\n    ],\n    [\n     {s:\"信任从哪来\",t:\"有人想攻击你，哪一句最有杀伤力?\",n:\"最疼的那一句，就是你的信任支点。\",o:[[\"你有执业资格吗\",{\"QUAL\":3}],[\"你自己做过吗\",{\"EXP\":3}],[\"你收了他家多少钱\",{\"INTEL\":3}],[\"你凭什么定义好看\",{\"AES\":3}],[\"你还在这一行做吗\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"哪句质疑会让你想删评论，而不是回怼?\",n:\"让你失态的那句，打在真身上。\",o:[[\"“你有没有资质讲这些”\",{\"QUAL\":3}],[\"“你自己都没做过”\",{\"EXP\":3}],[\"“你不就是收了钱吗”\",{\"INTEL\":3}],[\"“你的审美也就那样”\",{\"AES\":3}],[\"“你早就不在行业里了吧”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"同行最常用哪句话贬低你?\",n:\"\",o:[[\"“网红科普，能有多严谨”\",{\"QUAL\":3}],[\"“拿自己脸赌出来的话术”\",{\"EXP\":3}],[\"“就是个二道贩子”\",{\"INTEL\":3}],[\"“流量审美也配谈美学”\",{\"AES\":3}],[\"“外围人士谈什么行业”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"如果明天你塌房，标题会是哪句?\",n:\"预演一次，看哪里真的脆。\",o:[[\"“无证科普多年，误人无数”\",{\"QUAL\":3}],[\"“亲测人设造假”\",{\"EXP\":3}],[\"“收钱带路实锤”\",{\"INTEL\":3}],[\"“审美霸凌翻车”\",{\"AES\":3}],[\"“行业观察者人设崩塌”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"品牌方砍掉你，最可能给的理由?\",n:\"\",o:[[\"“专业争议风险”\",{\"QUAL\":3}],[\"“内容太真实，不好管”\",{\"EXP\":3}],[\"“带货能力不行”\",{\"INTEL\":3}],[\"“调性不高级”\",{\"AES\":3}],[\"“太小众，没声量”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"你最怕读者在背后说哪句?\",n:\"\",o:[[\"“她讲的东西别全信”\",{\"QUAL\":3}],[\"“她那个是摆拍吧”\",{\"EXP\":3}],[\"“她推的东西加了多少价”\",{\"INTEL\":3}],[\"“她的审美过时了”\",{\"AES\":3}],[\"“她早就脱离行业了”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"哪句话能让你整晚睡不着?\",n:\"\",o:[[\"“你负责得起吗”\",{\"QUAL\":3}],[\"“你的脸就是证据，赖不掉”\",{\"EXP\":3}],[\"“你每条推荐都有价钱”\",{\"INTEL\":3}],[\"“你所谓的好看只是你的好看”\",{\"AES\":3}],[\"“你对行业的判断错过一次”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"黑帖里点赞最高的评论会是?\",n:\"\",o:[[\"“查过，根本没这资质”\",{\"QUAL\":3}],[\"“所谓亲测是假的”\",{\"EXP\":3}],[\"“她拿返佣拿了三年”\",{\"INTEL\":3}],[\"“她把粉丝都教成了流水线脸”\",{\"AES\":3}],[\"“她说的行业趋势全错了”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"三年后如果被淘汰，判决书会是哪句?\",n:\"\",o:[[\"“专业不过硬，被正统取代”\",{\"QUAL\":3}],[\"“脸垮了，证据没了”\",{\"EXP\":3}],[\"“信息差被抹平了”\",{\"INTEL\":3}],[\"“审美被算法驯化了”\",{\"AES\":3}],[\"“行业变了，她还停在原地”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"你最想反驳、但一时反驳不了的是?\",n:\"反驳不了的，就是短板。\",o:[[\"“你的结论有没有文献支撑”\",{\"QUAL\":3}],[\"“你才做过几次就敢教人”\",{\"EXP\":3}],[\"“你知道底层供货价吗”\",{\"INTEL\":3}],[\"“你能定义美吗”\",{\"AES\":3}],[\"“你上一次进机构是什么时候”\",{\"IND\":3}]]},\n     {s:\"信任从哪来\",t:\"家人朋友如果反对你做这行，会说?\",n:\"\",o:[[\"“又没执照，出事怎么办”\",{\"QUAL\":3}],[\"“拿自己身体做内容，不值”\",{\"EXP\":3}],[\"“帮人带客，像什么样子”\",{\"INTEL\":3}],[\"“天天教人变美，虚荣”\",{\"AES\":3}],[\"“隔岸观火的活法，没前途”\",{\"IND\":3}]]}\n    ],\n    [\n     {s:\"信任从哪来\",t:\"你的读者主要是哪些人?\",n:\"\",o:[[\"还没做过、正在犹豫的人\",{\"EXP\":1,\"INTEL\":1}],[\"已经做过、在做维养的人\",{\"QUAL\":1,\"AES\":1}],[\"同行、机构、投资人\",{\"IND\":3}],[\"什么人都有，说不清\",{\"QUAL\":0.5,\"EXP\":0.5,\"INTEL\":0.5,\"AES\":0.5,\"IND\":0.5}]]},\n     {s:\"信任从哪来\",t:\"给你付过钱的人，画像是?\",n:\"付费人群，才是你的真实读者。\",o:[[\"怕踩坑的小白\",{\"EXP\":1,\"INTEL\":1}],[\"讲究效果的熟客\",{\"QUAL\":1,\"AES\":1}],[\"同行、机构、投资人\",{\"IND\":3}],[\"什么样的都有\",{\"QUAL\":0.5,\"EXP\":0.5,\"INTEL\":0.5,\"AES\":0.5,\"IND\":0.5}]]},\n     {s:\"信任从哪来\",t:\"你的内容最常被转发到什么群?\",n:\"\",o:[[\"闺蜜种草群\",{\"AES\":1,\"EXP\":1}],[\"医美交流群\",{\"QUAL\":1,\"INTEL\":1}],[\"同行、机构、投资人\",{\"IND\":3}],[\"各种群都有\",{\"QUAL\":0.5,\"EXP\":0.5,\"INTEL\":0.5,\"AES\":0.5,\"IND\":0.5}]]},\n     {s:\"信任从哪来\",t:\"私信里跟你聊得最久的是?\",n:\"\",o:[[\"决策反复的小白\",{\"EXP\":1,\"INTEL\":1}],[\"术后护理咨询的人\",{\"QUAL\":1,\"AES\":1}],[\"同行、机构、投资人\",{\"IND\":3}],[\"聊什么的都有\",{\"QUAL\":0.5,\"EXP\":0.5,\"INTEL\":0.5,\"AES\":0.5,\"IND\":0.5}]]},\n     {s:\"信任从哪来\",t:\"线下被认出来，对方第一句通常是?\",n:\"\",o:[[\"“跟着你避过坑”\",{\"INTEL\":1,\"EXP\":1}],[\"“按你说的做得很好”\",{\"QUAL\":1,\"AES\":1}],[\"同行、机构、投资人\",{\"IND\":3}],[\"“你们机构还招人吗”\",{\"QUAL\":0.5,\"EXP\":0.5,\"INTEL\":0.5,\"AES\":0.5,\"IND\":0.5}]]},\n     {s:\"信任从哪来\",t:\"你的活跃粉丝，备注你为?\",n:\"\",o:[[\"“靠谱博主”\",{\"QUAL\":1,\"INTEL\":1}],[\"“真实姐姐”\",{\"EXP\":1,\"AES\":1}],[\"同行、机构、投资人\",{\"IND\":3}],[\"“同行”
