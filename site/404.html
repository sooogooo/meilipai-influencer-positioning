<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>404 · 医美博主定位评估</title>

<style>
  *{box-sizing:border-box}

  a{display:inline-block;min-height:46px;line-height:46px;padding:0 34px;border-radius:8px;

<body>
<div class="col">
  <div>
