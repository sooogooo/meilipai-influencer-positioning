server {
    listen 80 ; 
    listen 443 ssl ; 
    server_name influencer.meilipai.vip; 
    index index.php index.html index.htm default.php default.htm default.html; 
    access_log /www/sites/influencer.meilipai.vip/log/access.log main; 
    error_log /www/sites/influencer.meilipai.vip/log/error.log; 
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404; 
    }
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403; 
    }
    root /www/sites/influencer.meilipai.vip/index; 
    error_page 404 /404.html; 
    http2 on; 
    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }
    ssl_certificate /www/sites/influencer.meilipai.vip/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/influencer.meilipai.vip/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2; 
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED; 
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    error_page 497 https://$host$request_uri; 
    proxy_set_header X-Forwarded-Proto https;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 缓存策略:HTML 走协商缓存,静态素材长缓存(expires 不影响 add_header 继承)
    location = /footer.js { expires 2h; }
    location ^~ /fonts/ { expires 30d; }
    location ~* \.(png|ico)$ { expires 7d; }

    # 动态分享卡片:结果链接带 ?r=格名-贴现率,微信爬虫抓到个性化 og
    # 白名单校验,非法值一律回落默认(无注入面)
    set_by_lua_block $og_t {
        local names = {["出诊型"]=1,["背书型"]=1,["资质套现型"]=1,["医生老板型"]=1,["蓄水型"]=1,
            ["陪跑型"]=1,["种草型"]=1,["线上渠道型"]=1,["体验转商家"]=1,["素人记录型"]=1,
            ["避坑顾问型"]=1,["测评型"]=1,["中介型"]=1,["比价商家"]=1,["情报观察型"]=1,
            ["审美顾问型"]=1,["审美种草型"]=1,["审美中介型"]=1,["风格自营型"]=1,["纯审美内容型"]=1,
            ["行业顾问型"]=1,["行业媒体型"]=1,["角色错配型"]=1,["从业者自营"]=1,["行业观察型"]=1}
        local r = ngx.unescape_uri(ngx.var.arg_r or "")
        local nm, dr = r:match("^(.+)%-(%d+)$")
        if nm and names[nm] and tonumber(dr) and tonumber(dr) <= 100 then
            return "我在「医美博主定位评估」里测出：" .. nm
        end
        return "医美博主定位评估"
    }
    set_by_lua_block $og_d {
        local names = {["出诊型"]=1,["背书型"]=1,["资质套现型"]=1,["医生老板型"]=1,["蓄水型"]=1,
            ["陪跑型"]=1,["种草型"]=1,["线上渠道型"]=1,["体验转商家"]=1,["素人记录型"]=1,
            ["避坑顾问型"]=1,["测评型"]=1,["中介型"]=1,["比价商家"]=1,["情报观察型"]=1,
            ["审美顾问型"]=1,["审美种草型"]=1,["审美中介型"]=1,["风格自营型"]=1,["纯审美内容型"]=1,
            ["行业顾问型"]=1,["行业媒体型"]=1,["角色错配型"]=1,["从业者自营"]=1,["行业观察型"]=1}
        local r = ngx.unescape_uri(ngx.var.arg_r or "")
        local nm, dr = r:match("^(.+)%-(%d+)$")
        if nm and names[nm] and tonumber(dr) and tonumber(dr) <= 100 then
            return "信任贴现率 " .. dr .. " · 25 格定位矩阵 · 也来测测你的位置"
        end
        return "12 道题看清你的信任从哪来、钱从哪来：25 格定位矩阵与信任贴现率，找到你在医美这一行的位置。"
    }
    sub_filter '<title>医美博主定位评估</title>' '<title>$og_t</title>';
    sub_filter 'content="医美博主定位评估">' 'content="$og_t">';
    sub_filter 'content="12 道题看清你的信任从哪来、钱从哪来：25 格定位矩阵与信任贴现率，找到你在医美这一行的位置。">' 'content="$og_d">';

    # 页脚注入:所有 HTML 页面在 </body> 前加载 footer.js(备案号等)
    sub_filter_once on;
    sub_filter '</body>' '<script src="/footer.js"></script></body>';
}